<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which Came First &mdash; EwanX</title>
  <!-- GitHub Pages serves static files only, so there is no server-side 301.
       The canonical tag tells search engines /whichfirst is the real page;
       the refresh and the script move real visitors. -->
  <link rel="canonical" href="https://ewanx.com/whichfirst/">
  <meta http-equiv="refresh" content="0; url=/whichfirst/">
  <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <script>location.replace('/whichfirst/' + location.search + location.hash);</script>
</head>
<body>
  <main class="container" style="padding-top: 64px;">
    <p class="m">Redirecting to <a class="link" href="/whichfirst/">ewanx.com/whichfirst</a>&hellip;</p>
  </main>
</body>
</html>
