<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which Came First &mdash; EwanX</title>
  <!-- GitHub Pages serves static files only, so there is no server-side 301.
       The canonical tag tells search engines /whichfirst is the real page;
       the refresh and the script move real visitors. -->
  <link rel="canonical" href="https://ewanx.com/whichfirst">
  <meta http-equiv="refresh" content="0; url=/whichfirst">
  <link rel="icon" type="image/png" href="/images/icon_solo_brain_64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>location.replace('/whichfirst' + location.search + location.hash);</script>
</head>
<body>

  <main class="app-page">
    <p class="app-blurb">Redirecting to <a href="/whichfirst">ewanx.com/whichfirst</a>&hellip;</p>
  </main>

</body>
</html>
